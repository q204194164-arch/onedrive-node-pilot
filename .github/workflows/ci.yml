name: macOS checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check public file boundary
        run: python3 scripts/check-public-files.py
      - name: Offline tests
        run: zsh scripts/test.sh
      - name: Build Apple Silicon app
        run: zsh build.sh
      - name: Verify local signatures
        run: codesign --verify --deep --strict 'build/OneDrive 选线.app'
